<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="16" fill="#090a0f"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#3358ff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Radial Glow Behind Shield -->
  <circle cx="32" cy="32" r="20" fill="#3358ff" fill-opacity="0.2"/>

  <!-- Shield Shape (ShieldAlert) -->
  <path d="M32 10L17 17V29C17 40.5 23.4 51.2 32 54C40.6 51.2 47 40.5 47 29V17L32 10Z" 
        fill="url(#shieldGrad)" 
        stroke="#4f75ff" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Alert / Exclamation Mark Core -->
  <path d="M32 23V34" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="41.5" r="1.75" fill="#ffffff"/>

  <defs>
    <linearGradient id="shieldGrad" x1="17" y1="10" x2="47" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2746"/>
      <stop offset="50%" stop-color="#11182c"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
  </defs>
</svg>
